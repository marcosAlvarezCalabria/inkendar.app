<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0f">
    <title>Sin conexión · Inkendar</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b0b0f; color: #f4efe6; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left)); }
      main { width: min(100%, 34rem); padding: clamp(1.5rem, 7vw, 3rem); border: 1px solid #625b52; border-radius: 1rem; background: #17171c; box-shadow: 0 1.25rem 4rem rgb(0 0 0 / 35%); }
      img { width: 2rem; height: 2rem; }
      h1 { margin: 1.5rem 0 .75rem; font-size: clamp(2rem, 10vw, 3.25rem); line-height: 1; }
      p { margin: 0 0 1rem; color: #d4cec5; line-height: 1.6; }
      a { display: inline-flex; min-height: 44px; align-items: center; margin-top: .5rem; padding: .7rem 1rem; border-radius: .6rem; background: #e5673f; color: #170d09; font-weight: 750; text-decoration: none; }
      a:focus-visible { outline: 3px solid #f4efe6; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/inkendar-mark.svg" alt="">
      <h1>Sin conexión</h1>
      <p>La aplicación y sus datos no están disponibles sin conexión. Inkendar no guarda mensajes, datos personales ni imágenes privadas para usarlos offline.</p>
      <p>Cuando recuperes la red, vuelve a intentarlo. Ningún cambio se ha enviado desde esta página.</p>
      <a href="">Volver a intentar</a>
    </main>
  </body>
</html>
